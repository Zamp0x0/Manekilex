name: 功能建议 / Feature request
description: 建议新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 读英文时遇到了什么不方便的地方。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 建议的做法
  - type: textarea
    id: data
    attributes:
      label: 数据与权限
      description: 这个功能是否需要新的浏览器权限，或者把更多内容发给服务商？
