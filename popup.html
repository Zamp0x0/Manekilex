<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Manekilex</title>
  <link rel="stylesheet" href="mk-buttons.css" />
  <style>
    body {
      width: 280px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--mk-bg, #fffaf0);
      color: var(--mk-text, #4f2f16);
    }
    .wrap {
      padding: 16px;
      text-align: center;
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 10px;
      display: block;
    }
    h1 {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 6px;
      color: var(--mk-text, #4f2f16);
    }
    p {
      font-size: 12px;
      color: var(--mk-text-muted, #8a6a45);
      margin: 0 0 14px;
      line-height: 1.4;
    }
    .mk-popup-main-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 0;
      padding: 0 16px;
      overflow: visible;
      box-sizing: border-box;
    }
    .mk-popup-btn {
      display: flex;
      width: 100%;
      min-height: 38px;
      padding: 0 16px;
      justify-content: center;
      box-sizing: border-box;
    }
    .mk-popup-main-btn > span {
      flex: 0 1 auto;
      text-align: center;
    }
    .mk-cat-popup {
      position: absolute;
      width: 38px;
      height: 38px;
      right: 0;
      top: -9px;
      object-fit: contain;
      object-position: right top;
      pointer-events: none;
    }
    .popup-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
    }
    .popup-actions .mk-btn {
      width: 100%;
      justify-content: center;
    }
    .popup-capture-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: -2px;
    }
    .capture-status {
      margin: 0;
      font-size: 11px;
      line-height: 1.45;
      min-height: 16px;
      text-align: left;
    }
    .capture-status.warn {
      color: #c76a10;
    }
    .capture-status.err {
      color: #d83424;
    }
    .capture-divider {
      height: 1px;
      background: rgba(138, 106, 69, 0.15);
      margin: 0;
    }
    .capture-note {
      font-size: 12px;
      color: var(--mk-text-muted, #8a6a45);
      text-align: left;
      margin: 0;
      line-height: 1.4;
    }
    .popup-top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 12px 0;
    }
    .popup-enable-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .popup-enable-switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .popup-enable-switch span {
      display: block;
      width: 34px;
      height: 18px;
      border-radius: 999px;
      background: rgba(138, 106, 69, 0.35);
      transition: background 0.15s ease;
      position: relative;
    }
    .popup-enable-switch span::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
      transition: transform 0.15s ease;
    }
    .popup-enable-switch input:checked + span {
      background: #e8a020;
    }
    .popup-enable-switch input:checked + span::after {
      transform: translateX(16px);
    }
    .popup-disabled-hint {
      font-size: 11px;
      color: #b45309;
      background: #fff6e8;
      padding: 8px;
      border-radius: 8px;
      margin: 0 0 12px;
      line-height: 1.45;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="popup-top-bar">
    <label class="popup-enable-switch" title="开启 / 关闭 Manekilex 划词功能">
      <input id="manekilexEnabledToggle" type="checkbox" checked />
      <span aria-hidden="true"></span>
    </label>
  </div>
  <div class="wrap">
    <img class="brand-logo" src="icons/icon48.png" alt="" width="48" height="48" />
    <h1>Manekilex</h1>
    <p>划词助手 · 点击下方打开完整设置</p>
    <p id="manekilexDisabledHint" class="popup-disabled-hint" hidden>
      Manekilex 当前已关闭，不会显示划词小球。
    </p>
    <p id="pdfHint" hidden style="font-size:11px;color:#b45309;background:#fff6e8;padding:8px;border-radius:8px;margin-bottom:12px;line-height:1.45;">
      PDF：在 Manekilex 阅读器里选中英文后点小猫查词；用 Chrome 自带查看器时，页面右上角有猫球，选中 → 右键查词。
    </p>
    <div class="popup-actions">
      <button type="button" id="openSettings" class="mk-btn mk-btn-primary mk-btn-md mk-popup-main-btn">
        <span>打开设置中心</span>
        <img class="mk-cat-popup" src="icons/css_2.png" alt="" />
      </button>
      <div class="capture-divider"></div>
      <div class="popup-capture-block">
        <p class="capture-note">实时转译：请先停留在 YouTube / Coursera 等网页，再点此按钮。</p>
        <p class="capture-status" id="captureTabStatus"></p>
        <button type="button" id="captureTabAudio" class="mk-btn mk-btn-primary mk-btn-md mk-popup-btn">
          <span>捕获当前标签页声音</span>
        </button>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
